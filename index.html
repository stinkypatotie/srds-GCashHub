<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Fee Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            z-index: 0;
        }

        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-bottom: 20px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .transaction-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .transaction-btn {
            padding: 50px 20px;
            border: 3px solid;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .transaction-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .transaction-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .transaction-btn .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .transaction-btn.cash-in {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            border-color: #10b981;
            color: #065f46;
        }

        .transaction-btn.cash-out {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-color: #ef4444;
            color: #991b1b;
        }

        .transaction-btn.mobile-load {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-color: #3b82f6;
            color: #1e40af;
        }

        .transaction-btn.staff-only {
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            border-color: #a855f7;
            color: #6b21a8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .calculation-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .calculation-box h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .calculation-box p {
            margin: 8px 0;
            font-size: 16px;
        }

        .calculation-box .total {
            font-size: 28px;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
        }

        .transaction-history {
            margin-top: 30px;
        }

        .transaction-item {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 12px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }

        .transaction-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .transaction-item .type {
            display: inline-block;
            padding: 6px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .transaction-item .timestamp {
            float: right;
            color: #6b7280;
            font-size: 12px;
        }

        .transaction-item .details {
            color: #374151;
            margin-top: 10px;
            font-weight: 500;
        }

        .admin-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            font-weight: 700;
            color: #374151;
        }

        .hidden {
            display: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .text-center {
            text-align: center;
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            z-index: 1000;
            animation: slideInRight 0.5s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .transaction-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 24px;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="mainView" class="card">
            <div class="header">
                <h1>💰 Transaction Hub</h1>
                <button class="btn btn-primary" onclick="showAdminLogin()">🔐 Admin</button>
            </div>
            <div id="transactionSelector">
                <div class="transaction-grid">
                    <button class="transaction-btn cash-in" onclick="selectTransaction('CASH IN')">
                        <span class="emoji">💵</span>Cash In
                    </button>
                    <button class="transaction-btn cash-out" onclick="selectTransaction('CASH OUT')">
                        <span class="emoji">💸</span>Cash Out
                    </button>
                    <button class="transaction-btn mobile-load" onclick="selectTransaction('MOBILE LOAD')">
                        <span class="emoji">📱</span>Mobile Load
                    </button>
                    <button class="transaction-btn staff-only" onclick="selectTransaction('STAFF ONLY')">
                        <span class="emoji">👤</span>Staff Only
                    </button>
                </div>
            </div>
            <div id="transactionForm" class="hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 id="transactionTitle"></h2>
                    <button class="btn btn-secondary" onclick="resetTransaction()">🔄 Change</button>
                </div>
                <div id="amountGroup" class="form-group">
                    <label>💰 Amount (PHP)</label>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="Enter amount" oninput="updateCalculation()">
                </div>
                <div id="cashOutOptions" class="form-group hidden">
                    <label>⚙️ Fee Option</label>
                    <select id="cashOutOption" onchange="updateCalculation()">
                        <option value="add">Add fee to amount</option>
                        <option value="deduct">Deduct fee from amount</option>
                    </select>
                </div>
                <div id="staffFields" class="hidden">
                    <div class="form-group">
                        <label>💰 Amount (PHP)</label>
                        <input type="number" id="staffAmount" step="0.01" min="0" placeholder="Enter amount">
                    </div>
                    <div class="form-group">
                        <label>👤 Staff Name</label>
                        <input type="text" id="staffName" placeholder="Enter staff name">
                    </div>
                    <div class="form-group">
                        <label>📝 Remarks</label>
                        <textarea id="remarks" rows="3" placeholder="Enter remarks"></textarea>
                    </div>
                </div>
                <div id="calculationBox" class="calculation-box hidden"></div>
                <div id="tenderedGroup" class="form-group hidden">
                    <label id="tenderedLabel">💵 Amount Tendered (PHP)</label>
                    <input type="number" id="tendered" step="0.01" min="0" placeholder="Enter amount tendered" oninput="updateChange()">
                </div>
                <div id="changeBox" class="calculation-box hidden" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                    <h3>💸 Change</h3>
                    <p class="total" id="changeAmount">PHP 0.00</p>
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="submitTransaction()">✅ Submit Transaction</button>
            </div>
            <div id="recentTransactions" class="transaction-history hidden">
                <h3>📊 Recent Transactions</h3>
                <div id="transactionsList"></div>
            </div>
        </div>
        <div id="adminLoginView" class="card hidden">
            <div class="text-center mb-20">
                <h2>🔐 Admin Login</h2>
            </div>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="Enter password" onkeypress="handleLoginEnter(event)">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="adminLogin()">🔓 Login</button>
            <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="hideAdminLogin()">← Back</button>
            <p style="text-align: center; margin-top: 15px; color: #6b7280; font-size: 12px;">AUTHORIZED PERSONEL ONLY</p>
        </div>
        <div id="adminPanelView" class="hidden">
            <div class="card">
                <div class="header">
                    <h2>⚙️ Admin Panel</h2>
                    <button class="btn btn-secondary" onclick="logoutAdmin()">🚪 Logout</button>
                </div>
                <div class="grid-2 mb-20">
                    <div class="form-group">
                        <label>🤖 Telegram Bot Token</label>
                        <input type="text" id="telegramToken" placeholder="Enter bot token">
                    </div>
                    <div class="form-group">
                        <label>💬 Telegram Chat ID</label>
                        <input type="text" id="telegramChatId" placeholder="Enter chat ID">
                    </div>
                </div>
                <div class="admin-controls">
                    <button class="btn btn-success" onclick="exportCSV()">📥 Export CSV</button>
                    <button class="btn btn-info" onclick="sendAllTelegram()">📤 Send All to Telegram</button>
                    <button class="btn btn-danger" onclick="clearLog()">🗑️ Clear Log</button>
                </div>
            </div>
            <div class="card">
                <h3>📋 Transaction History (<span id="transactionCount">0</span>)</h3>
                <div style="overflow-x: auto;">
                    <table><thead><tr><th>⏰ Timestamp</th><th>📌 Type</th><th>📝 Details</th></tr></thead><tbody id="adminTableBody"></tbody></table>
                </div>
            </div>
        </div>
    </div>
    <script>
var transactions=[];
var currentTransaction='';
var telegramToken='';
var telegramChatId='';
var currentTotal=0;

function loadTransactions(){
    var s=localStorage.getItem('transactions');
    if(s){transactions=JSON.parse(s)}
    var tk=localStorage.getItem('telegramToken');
    if(tk){telegramToken=tk;document.getElementById('telegramToken').value=tk}
    var ci=localStorage.getItem('telegramChatId');
    if(ci){telegramChatId=ci;document.getElementById('telegramChatId').value=ci}
    updateTransactionDisplay()
}

function saveTransactions(){
    localStorage.setItem('transactions',JSON.stringify(transactions))
}

function saveTelegramSettings(){
    var tk=document.getElementById('telegramToken').value;
    var ci=document.getElementById('telegramChatId').value;
    localStorage.setItem('telegramToken',tk);
    localStorage.setItem('telegramChatId',ci);
    telegramToken=tk;
    telegramChatId=ci
}

function calculateFee(a){
    var n=parseFloat(a);
    if(n<=500)return 10;
    if(n<=1000)return 15;
    if(n<=2000)return 20;
    if(n<=3000)return 30;
    if(n<=4000)return 40;
    if(n<=5000)return 50;
    if(n<=5500)return 55;
    if(n<=6000)return 60;
    if(n<=6500)return 65;
    if(n<=7000)return 70;
    if(n<=7500)return 75;
    if(n<=8000)return 80;
    if(n<=8500)return 85;
    if(n<=9000)return 90;
    if(n<=9500)return 95;
    if(n<=10000)return 100;
    return n*0.01
}

function selectTransaction(t){
    currentTransaction=t;
    document.getElementById('transactionSelector').classList.add('hidden');
    document.getElementById('transactionForm').classList.remove('hidden');
    document.getElementById('transactionTitle').textContent=t;
    
    if(t==='STAFF ONLY'){
        document.getElementById('amountGroup').classList.add('hidden');
        document.getElementById('cashOutOptions').classList.add('hidden');
        document.getElementById('staffFields').classList.remove('hidden');
        document.getElementById('calculationBox').classList.add('hidden');
        document.getElementById('tenderedGroup').classList.add('hidden');
        document.getElementById('changeBox').classList.add('hidden')
    }else{
        document.getElementById('amountGroup').classList.remove('hidden');
        document.getElementById('staffFields').classList.add('hidden');
        document.getElementById('tenderedGroup').classList.remove('hidden');
        
        if(t==='CASH OUT'){
            document.getElementById('cashOutOptions').classList.remove('hidden');
            document.getElementById('tenderedLabel').textContent='💸 Amount Sent (PHP)'
        }else{
            document.getElementById('cashOutOptions').classList.add('hidden');
            document.getElementById('tenderedLabel').textContent='💵 Amount Tendered (PHP)'
        }
    }
}

function resetTransaction(){
    currentTransaction='';
    currentTotal=0;
    document.getElementById('transactionSelector').classList.remove('hidden');
    document.getElementById('transactionForm').classList.add('hidden');
    document.getElementById('amount').value='';
    document.getElementById('tendered').value='';
    document.getElementById('staffAmount').value='';
    document.getElementById('staffName').value='';
    document.getElementById('remarks').value='';
    document.getElementById('calculationBox').classList.add('hidden');
    document.getElementById('tenderedGroup').classList.add('hidden');
    document.getElementById('changeBox').classList.add('hidden')
}

function updateCalculation(){
    var a=document.getElementById('amount').value;
    if(!a||currentTransaction==='STAFF ONLY')return;
    var n=parseFloat(a);
    var c=document.getElementById('calculationBox');
    var h='<h3>💫 Calculation:</h3>';
    
    if(currentTransaction==='CASH IN'){
        var f=calculateFee(n);
        var t=n+f;
        currentTotal=t;
        h+='<p>💵 Amount: PHP '+n.toFixed(2)+'</p>';
        h+='<p>📊 Fee: PHP '+f.toFixed(2)+'</p>';
        h+='<p class="total">💰 Total: PHP '+t.toFixed(2)+'</p>'
    }else if(currentTransaction==='CASH OUT'){
        var f=calculateFee(n);
        var o=document.getElementById('cashOutOption').value;
        if(o==='add'){
            var t=n+f;
            currentTotal=t;
            h+='<p>💸 Amount: PHP '+n.toFixed(2)+'</p>';
            h+='<p>📊 Fee: PHP '+f.toFixed(2)+'</p>';
            h+='<p class="total">💰 Total: PHP '+t.toFixed(2)+'</p>'
        }else{
            var r=n-f;
            currentTotal=n;
            h+='<p>💸 Amount: PHP '+n.toFixed(2)+'</p>';
            h+='<p>📊 Fee: PHP '+f.toFixed(2)+' (Deducted)</p>';
            h+='<p class="total">\n💰 Customer Receives: PHP '+r.toFixed(2)+'</p>'
        }
    }else if(currentTransaction==='MOBILE LOAD'){
        var f=5;
        var t=n+f;
        currentTotal=t;
        h+='<p>📱 Load: PHP '+n.toFixed(2)+'</p>';
        h+='<p>📊 Fee: PHP 5.00</p>';
        h+='<p class="total">💰 Total: PHP '+t.toFixed(2)+'</p>'
    }
    
    c.innerHTML=h;
    c.classList.remove('hidden');
    updateChange()
}

function updateChange(){
    var t=parseFloat(document.getElementById('tendered').value);
    if(!t||currentTransaction==='CASH OUT'||currentTransaction==='STAFF ONLY'){
        document.getElementById('changeBox').classList.add('hidden');
        return
    }
    
    var change=t-currentTotal;
    if(change>=0){
        document.getElementById('changeAmount').textContent='PHP '+change.toFixed(2);
        document.getElementById('changeBox').classList.remove('hidden')
    }else{
        document.getElementById('changeBox').classList.add('hidden')
    }
}

function showNotification(msg){
    var n=document.createElement('div');
    n.className='notification';
    n.textContent=msg;
    document.body.appendChild(n);
    setTimeout(function(){
        n.style.opacity='0';
        setTimeout(function(){document.body.removeChild(n)},500)
    },3000)
}

function sendTelegramNotification(tx){
    saveTelegramSettings();
    if(!telegramToken||!telegramChatId){return}
    
    var emoji='';
    if(tx.type==='CASH IN')emoji='💵';
    else if(tx.type==='CASH OUT')emoji='💸';
    else if(tx.type==='MOBILE LOAD')emoji='📱';
    else if(tx.type==='STAFF ONLY')emoji='👤';
    
    // Compact format
    var msg=emoji+' '+tx.type+'\n';
    msg+='Amount: ₱'+tx.amount.toFixed(2)+'\nFee: ₱'+tx.fee.toFixed(2);
    
    if(tx.type==='CASH OUT' && tx.feeDeducted){
        msg+=' (Deducted)\nReceives: ₱'+tx.received.toFixed(2);
    }else{
        msg+='\nTotal: ₱'+tx.total.toFixed(2);
    }
    
    if(tx.type!=='CASH OUT' && tx.tendered>0){
        msg+='\nTendered: ₱'+tx.tendered.toFixed(2)+'\nChange: ₱'+tx.change.toFixed(2);
    }else if(tx.type==='CASH OUT' && tx.tendered>0){
        msg+='\nAmount Sent: ₱'+tx.tendered.toFixed(2);
    }
    
    if(tx.staffName){
        msg+='\nStaff: '+tx.staffName;
    }
    
    if(tx.remarks){
        msg+='\nRemarks: '+tx.remarks;
    }
    
    msg+='\n'+tx.timestamp;
    
    fetch('https://api.telegram.org/bot'+telegramToken+'/sendMessage',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            chat_id:telegramChatId,
            text:msg
        })
    }).then(function(rsp){
        if(rsp.ok){console.log('Telegram sent')}
    }).catch(function(err){
        console.log('Telegram failed')
    })
}

function submitTransaction(){
    var n=parseFloat(document.getElementById('amount').value);
    var td=parseFloat(document.getElementById('tendered').value)||0;
    var sa=parseFloat(document.getElementById('staffAmount').value);
    var s=document.getElementById('staffName').value;
    var r=document.getElementById('remarks').value;
    var o=document.getElementById('cashOutOption').value;
    
    if(currentTransaction!=='STAFF ONLY'&&!n){
        alert('Please enter an amount');
        return
    }
    
    if(currentTransaction==='STAFF ONLY'&&(!sa||!s||!r)){
        alert('Please enter amount, staff name and remarks');
        return
    }
    
    if(currentTransaction!=='STAFF ONLY'&&currentTransaction!=='CASH OUT'&&td>0&&td<currentTotal){
        alert('Insufficient amount tendered');
        return
    }
    
    var f=0,t=0,rc=0,ch=0,d='',fd=false;
    
    if(currentTransaction==='CASH IN'){
        f=calculateFee(n);
        t=n+f;
        ch=td>0?td-t:0;
        d='Amount: PHP '+n.toFixed(2)+'\nFee: PHP '+f.toFixed(2)+'\nTotal: PHP '+t.toFixed(2)
    }else if(currentTransaction==='CASH OUT'){
        f=calculateFee(n);
        if(o==='add'){
            t=n+f;
            rc=n;
            d='Amount: PHP '+n.toFixed(2)+'\nFee: PHP '+f.toFixed(2)+'\nTotal: PHP '+t.toFixed(2)
        }else{
            t=n;
            rc=n-f;
            fd=true;
            d='Amount: PHP '+n.toFixed(2)+'\nFee: PHP '+f.toFixed(2)+' (Deducted)\nReceives: PHP '+rc.toFixed(2)
        }
    }else if(currentTransaction==='MOBILE LOAD'){
        f=5;
        t=n+f;
        ch=td>0?td-t:0;
        d='Load: PHP '+n.toFixed(2)+'\nFee: PHP '+f.toFixed(2)+'\nTotal: PHP '+t.toFixed(2)
    }else if(currentTransaction==='STAFF ONLY'){
        d='Amount: PHP '+sa.toFixed(2)+'\nStaff: '+s+'\nRemarks: '+r;
        n=sa
    }
    
    var tx={
        id:Date.now(),
        type:currentTransaction,
        amount:n||0,
        fee:f,
        total:t,
        received:rc,
        tendered:td,
        change:ch,
        feeDeducted:fd,
        details:d,
        timestamp:new Date().toLocaleString(),
        staffName:s||'',
        remarks:r||''
    };
    
    transactions.unshift(tx);
    saveTransactions();
    sendTelegramNotification(tx);
    updateTransactionDisplay();
    resetTransaction();
    showNotification('✅ Transaction submitted successfully!')
}

function updateTransactionDisplay(){
    var l=document.getElementById('transactionsList');
    var rd=document.getElementById('recentTransactions');
    
    if(transactions.length===0){
        rd.classList.add('hidden');
        return
    }
    
    rd.classList.remove('hidden');
    var rc=transactions.slice(0,5);
    var h='';
    
    for(var i=0;i<rc.length;i++){
        var tx=rc[i];
        h+='<div class="transaction-item">';
        h+='<span class="type">'+tx.type+'</span>';
        h+='<span class="timestamp">'+tx.timestamp+'</span>';
        h+='<div class="details">'+tx.details+'</div>';
        h+='</div>'
    }
    
    l.innerHTML=h;
    
    var ab=document.getElementById('adminTableBody');
    if(ab){
        var th='';
        for(var j=0;j<transactions.length;j++){
            var tx=transactions[j];
            th+='<tr>';
            th+='<td style="font-size: 12px;">'+tx.timestamp+'</td>';
            th+='<td><span class="type">'+tx.type+'</span></td>';
            th+='<td style="font-size: 14px;">'+tx.details+'</td>';
            th+='</tr>'
        }
        ab.innerHTML=th
    }
    
    document.getElementById('transactionCount').textContent=transactions.length
}

function showAdminLogin(){
    document.getElementById('mainView').classList.add('hidden');
    document.getElementById('adminLoginView').classList.remove('hidden')
}

function hideAdminLogin(){
    document.getElementById('mainView').classList.remove('hidden');
    document.getElementById('adminLoginView').classList.add('hidden')
}

function handleLoginEnter(e){
    if(e.key==='Enter'){adminLogin()}
}

function adminLogin(){
    var p=document.getElementById('adminPassword').value;
    if(p==='admin123'){
        document.getElementById('adminLoginView').classList.add('hidden');
        document.getElementById('adminPanelView').classList.remove('hidden');
        updateTransactionDisplay();
        document.getElementById('adminPassword').value=''
    }else{
        alert('Incorrect password')
    }
}

function logoutAdmin(){
    document.getElementById('adminPanelView').classList.add('hidden');
    document.getElementById('mainView').classList.remove('hidden')
}

function exportCSV(){
    var h=['Timestamp','Type','Amount','Fee','Total','Tendered','Change','Details'];
    var rs=[];
    
    for(var i=0;i<transactions.length;i++){
        var tx=transactions[i];
        var dc=tx.details.replace(/,/g,';');
        rs.push([tx.timestamp,tx.type,tx.amount,tx.fee,tx.total,tx.tendered||0,tx.change||0,dc])
    }
    
    var csv=h.join(',')+'\n';
    for(var j=0;j<rs.length;j++){
        csv+=rs[j].join(',')+'\n'
    }
    
    var b=new Blob([csv],{type:'text/csv'});
    var u=window.URL.createObjectURL(b);
    var a=document.createElement('a');
    a.href=u;
    var ds=new Date().toISOString().split('T')[0];
    a.download='transactions_'+ds+'.csv';
    a.click();
    showNotification('📥 CSV exported successfully!')
}

function sendAllTelegram(){
    saveTelegramSettings();
    var tk=document.getElementById('telegramToken').value;
    var ci=document.getElementById('telegramChatId').value;
    
    if(!tk||!ci){
        alert('Please set Telegram Bot Token and Chat ID');
        return
    }
    
    var ms=[];
    var lm=Math.min(10,transactions.length);
    
    for(var i=0;i<lm;i++){
        var tx=transactions[i];
        var emoji='';
        if(tx.type==='CASH IN')emoji='💵';
        else if(tx.type==='CASH OUT')emoji='💸';
        else if(tx.type==='MOBILE LOAD')emoji='📱';
        else if(tx.type==='STAFF ONLY')emoji='👤';
        
        var mg=emoji+' '+tx.type+' | ₱'+tx.total.toFixed(2)+'\n'+tx.timestamp;
        ms.push(mg)
    }
    
    var m='📊 TRANSACTION REPORT\n\n'+ms.join('\n\n')+'\n\nTotal: '+transactions.length+' transactions';
    
    fetch('https://api.telegram.org/bot'+tk+'/sendMessage',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            chat_id:ci,
            text:m
        })
    }).then(function(rsp){
        if(rsp.ok){
            showNotification('📤 Sent to Telegram successfully!')
        }else{
            alert('Failed to send to Telegram')
        }
    }).catch(function(err){
        alert('Failed to send to Telegram')
    })
}

function clearLog(){
    if(confirm('Are you sure you want to clear all transactions?')){
        transactions=[];
        saveTransactions();
        updateTransactionDisplay();
        showNotification('🗑️ Transaction log cleared!')
    }
}
